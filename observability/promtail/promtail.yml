server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pqmsg-server-json
    static_configs:
      - targets:
          - localhost
        labels:
          job: pqmsg-server
          source: app
          __path__: /var/log/pqmsg/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            target: target
            request_id: request_id
      - labels:
          level:
          target:
          request_id:

  - job_name: pqmsg-server-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: pqmsg-server
          source: audit
          __path__: /var/log/pqmsg/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            event: event
            outcome: outcome
            request_id: request_id
            user_id: user_id
            device_id: device_id
      - labels:
          event:
          outcome:
          request_id:
          user_id:
          device_id:
