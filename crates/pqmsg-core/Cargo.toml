[package]
name = "pqmsg-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8"
aes-gcm.workspace = true
argon2.workspace = true
ctr = "0.9"
base64.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
rand_core.workspace = true
secrecy.workspace = true
serde.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
thiserror.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true
oqs = { version = "0.11", default-features = false, features = ["vendored", "ml_kem", "kyber", "dilithium", "ml_dsa"], optional = true }
fips203 = { version = "0.4.3", default-features = false, features = ["ml-kem-768"], optional = true }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-65"], optional = true }
cryptoki = { version = "0.7", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
serde_json = "1"

[features]
default = []
pq-oqs = ["dep:oqs"]
pq-rust = ["dep:fips203", "dep:fips204"]
fips = ["pq-oqs"]
classical-only-INSECURE = []
hsm-pkcs11 = ["dep:cryptoki"]
wasm = ["classical-only-INSECURE", "dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook", "dep:js-sys", "dep:getrandom"]
wasm-pq = ["pq-rust", "dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:console_error_panic_hook", "dep:js-sys", "dep:getrandom"]

[dev-dependencies]
rand.workspace = true
rand_chacha = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1"
hex = "0.4"

[[bench]]
name = "crypto_benchmarks"
harness = false
