apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pqmsg-server.fullname" . }}
  labels:
    {{- include "pqmsg-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pqmsg-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pqmsg-server.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pqmsg-server
          image: "{{ include "pqmsg-server.imageRef" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
              name: https
          envFrom:
            - configMapRef:
                name: {{ include "pqmsg-server.fullname" . }}-config
            - secretRef:
                name: {{ include "pqmsg-server.fullname" . }}-secret
          volumeMounts:
            - name: tls
              mountPath: /etc/pqmsg/tls
              readOnly: true
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.tlsSecretName }}
