apiVersion: v1
kind: Service
metadata:
  name: {{ include "pqmsg-server.fullname" . }}
  labels:
    {{- include "pqmsg-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pqmsg-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
