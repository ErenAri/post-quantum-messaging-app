{{- include "pqmsg-server.validateDeploymentContract" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pqmsg-server.fullname" . }}-config
  labels:
    {{- include "pqmsg-server.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
