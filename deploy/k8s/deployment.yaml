apiVersion: apps/v1
kind: Deployment
metadata:
  name: pqmsg-server
  namespace: pqmsg
  labels:
    app.kubernetes.io/name: pqmsg-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pqmsg-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pqmsg-server
    spec:
      containers:
        - name: pqmsg-server
          image: ghcr.io/your-org/pqmsg-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: https
          envFrom:
            - configMapRef:
                name: pqmsg-server-config
            - secretRef:
                name: pqmsg-server-secrets
          volumeMounts:
            - name: tls
              mountPath: /etc/pqmsg/tls
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1024Mi
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tls
          secret:
            secretName: pqmsg-server-tls
